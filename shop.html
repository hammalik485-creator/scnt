<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Combo Packs Fragrances | SCNT</title>
<meta name="description" content="Browse every SCNT fragrance — men's, women's, unisex and gift bundles. Luxury-inspired perfumes with free delivery over Rs. 3,000.">
<link rel="icon" href="logos stuff/fav icon green.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="site-header"></div>

<div class="page-head">
  <div class="wrap">
    <div class="breadcrumb"><a href="index.html">Home</a> / <span id="crumb">Combo Packs</span></div>
    <h1 id="pageTitle">All Fragrances</h1>
    <p id="pageSub">Find your signature scent.</p>
  </div>
</div>

<section class="section" style="padding-top:2.5rem">
  <div class="wrap">
    <div class="shop-toolbar">
      <div class="filters" id="filters"></div>
      <div style="display:flex;align-items:center;gap:1rem">
        <span class="result-count" id="resultCount"></span>
        <select class="sort-select" id="sort">
          <option value="featured">Sort: Featured</option>
          <option value="low">Price: Low to High</option>
          <option value="high">Price: High to Low</option>
          <option value="rating">Top Rated</option>
        </select>
      </div>
    </div>
    <div class="product-grid" id="shopGrid"></div>
    <div id="empty" class="spin" style="display:none">No products match this filter.</div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  buildChrome("shop");

  let catFilter = "packs";
  let sortMode = "featured";

  const filterDefs = [
    { key: "packs", label: "All Packs" }
  ];

  function renderFilters() {
    document.getElementById("filters").innerHTML = filterDefs.map(f =>
      `<button class="chip active" data-f="${f.key}">${f.label}</button>`
    ).join("");
  }

  function apply() {
    let list = [...PACKS];
    if (sortMode === "low")  list.sort((a,b)=>a.price-b.price);
    if (sortMode === "high") list.sort((a,b)=>b.price-a.price);
    if (sortMode === "featured") list.sort((a,b)=>(b.count||0)-(a.count||0));

    const grid = document.getElementById("shopGrid");
    grid.innerHTML = list.map(card).join("");
    observeReveals();
    document.getElementById("empty").style.display = list.length ? "none" : "block";
    document.getElementById("resultCount").textContent = list.length + " pack" + (list.length!==1?"s":"");

    document.getElementById("pageTitle").textContent = "Perfume Combo Offers";
    document.getElementById("pageSub").textContent = "Curated packs at special prices — free delivery all over Saudi Arabia.";
    document.getElementById("crumb").textContent = "Combo Packs";
    renderFilters();
  }

  document.getElementById("sort").onchange = e => { sortMode = e.target.value; apply(); };
  apply();
</script>
</body>
</html>
