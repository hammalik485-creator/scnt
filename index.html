<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCNT — Bold. Elegant. Unforgettable. | Luxury-Inspired Perfumes</title>
<meta name="description" content="SCNT — luxury-inspired fragrances for men & women. Long-lasting perfumes at a price that makes sense. Perfume combo packs with free delivery all over Saudi Arabia. Cash on Delivery.">
<link rel="icon" href="logos stuff/fav icon green.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="site-header"></div>

<!-- HERO -->
<section class="hero">
  <div class="wrap hero-grid">
    <div class="hero-copy">
      <span class="eyebrow">The SCNT Collection</span>
      <h1>Bold. Elegant.<br><span class="gold">Unforgettable.</span></h1>
      <p>Luxury-inspired fragrances crafted to turn heads and last all day — without the luxury price tag.</p>
      <div class="hero-cta">
        <a href="shop.html" class="btn btn-dark btn-lg">Shop the Collection</a>
        <a href="shop.html?cat=packs" class="btn btn-outline btn-lg">Gift Bundles</a>
      </div>
    </div>
    <div class="hero-media">
      <img id="heroImg" src="logos stuff/Snct hero page image finl.png" alt="SCNT signature fragrance">
    </div>
  </div>
</section>

<!-- TRUST -->
<div class="trust">
  <div class="wrap trust-grid" id="trustGrid"></div>
</div>

<!-- ALL PACKS (shop-style with filters) -->
<section class="section" style="padding-top:clamp(2.5rem,5vw,4rem)">
  <div class="wrap">
    <div class="section-head reveal">
      <span class="eyebrow">Combo Packs</span>
      <h2 id="homePacksTitle">All Packs</h2>
      <p id="homePacksSub">Curated packs at special prices — free delivery all over Saudi Arabia.</p>
    </div>
    <div class="filters" id="homeFilters" style="display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-bottom:2.2rem"></div>
    <div class="product-grid" id="homePacksGrid"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  buildChrome("home");
  // Trust strip
  document.getElementById("trustGrid").innerHTML = [
    [IC.truck, "Free Delivery All Over Saudi Arabia 🇸🇦"],
    [IC.shield, "Long-Lasting Oils"],
    [IC.gift, "Cash on Delivery"],
    [IC.leaf, "Cruelty-Free"]
  ].map(([i,t]) => `<div class="trust-item">${i}<span>${t}</span></div>`).join("");

  // Grids
  // Shop-style filterable pack grid
  let homeGender = "All";
  const homeDefs = [
    { key: "All",    label: "All Packs" },
    { key: "Men",    label: "Men" },
    { key: "Women",  label: "Women" },
    { key: "Unisex", label: "Mixed & Complete" }
  ];
  const homeTitles = {
    "All":    ["All Packs", "Curated packs at special prices — free delivery all over Saudi Arabia."],
    "Men":    ["Men's Packs", "Bold combos for the modern man."],
    "Women":  ["Women's Packs", "Elegant sets she'll love."],
    "Unisex": ["Mixed & Complete Packs", "The best of both — and the full collection."]
  };
  function renderHomeFilters() {
    document.getElementById("homeFilters").innerHTML = homeDefs.map(f =>
      `<button class="chip ${homeGender===f.key?'active':''}" data-f="${f.key}">${f.label}</button>`
    ).join("");
    document.querySelectorAll("#homeFilters .chip").forEach(c => c.onclick = () => {
      homeGender = c.dataset.f;
      applyHome();
    });
  }
  function applyHome() {
    let list = [...PACKS];
    if (homeGender !== "All") list = list.filter(p => p.gender === homeGender);
    renderGrid(document.getElementById("homePacksGrid"), list);
    document.getElementById("homePacksTitle").textContent = homeTitles[homeGender][0];
    document.getElementById("homePacksSub").textContent = homeTitles[homeGender][1];
    renderHomeFilters();
  }
  applyHome();
  observeReveals();
</script>
</body>
</html>
